<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSH Desktop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div data-tauri-drag-region id="frame">DSH Desktop</div>
    <main>
      <h1 id="message"></h1>
      <p id="detail"></p>
      <div class="actions" id="actions"></div>
    </main>
    <script>
      const params = new URLSearchParams(location.search)
      const encoded = params.get('state')
      let state = { title: 'DSH Desktop', message: '', detail: '', buttons: ['OK'], defaultId: 0, cancelId: 0 }
      if (encoded) {
        try {
          const padded = encoded.replaceAll('-', '+').replaceAll('_', '/')
          const json = atob(padded.padEnd(Math.ceil(padded.length / 4) * 4, '='))
          state = { ...state, ...JSON.parse(json) }
        } catch {}
      }
      document.title = state.title || 'DSH Desktop'
      document.getElementById('frame').textContent = state.title || 'DSH Desktop'
      document.getElementById('message').textContent = state.message || ''
      document.getElementById('detail').textContent = state.detail || ''
      const actions = document.getElementById('actions')
      state.buttons.forEach((label, index) => {
        const button = document.createElement('a')
        button.className = 'btn' + (index === state.defaultId ? ' primary' : '')
        button.textContent = label
        button.href = 'dsh-desktop-dialog://response?id=' + index
        actions.appendChild(button)
      })
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') location.href = 'dsh-desktop-dialog://response?id=' + String(state.cancelId ?? 0)
      })
    </script>
  </body>
</html>
