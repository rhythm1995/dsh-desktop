name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    name: Host (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Host
        run: pnpm build:host
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  shell:
    name: Shell (cargo check + test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri-build 校验 tauri.conf.json 的 bundle.resources（../host/dist），
      # 所以 Rust 编译前必须先把 Host 编译出来
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Host
        run: pnpm build:host
      - name: Cargo check
        run: cargo check --all-targets
        working-directory: src-tauri
      - name: Cargo test
        run: cargo test
        working-directory: src-tauri
