name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      DSH_DEV_TOOLS: "0"
      DSH_PROFILE: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache bundled JS runtimes
        uses: actions/cache@v4
        with:
          path: |
            vendor/runtimes
            vendor/runtimes-cache
          key: runtimes-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/runtimes.lock.json') }}
      - name: Fetch bundled JS runtimes
        run: pnpm fetch:runtimes
      - name: Package production app
        run: npx tauri build --bundles app,dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # .app 是目录，Release 资产必须是文件，先压成 tar.gz
      - name: Compress app bundle
        run: |
          cd src-tauri/target/release/bundle/macos
          tar -czf DSH.Desktop.app.tar.gz *.app
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/DSH.Desktop.app.tar.gz
          fail_on_unmatched_files: true
