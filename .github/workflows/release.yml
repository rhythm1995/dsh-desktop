name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      DSH_DEV_TOOLS: "0"
      DSH_PROFILE: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Package production app
        run: npx tauri build --bundles app,dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # .app 是目录，Release 资产必须是文件，先压成 tar.gz
      - name: Compress app bundle
        run: |
          cd src-tauri/target/release/bundle/macos
          tar -czf DSH.Desktop.app.tar.gz *.app
      # 只有推 v* tag 时才发布 Release；workflow_dispatch 只打包并留 artifact，
      # 避免手动触发时因缺少 tag 而失败
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/DSH.Desktop.app.tar.gz
          fail_on_unmatched_files: true
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-bundles
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/DSH.Desktop.app.tar.gz
