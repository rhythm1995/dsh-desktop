[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DSH Desktop Tauri shell"
authors = ["DSH Desktop"]
edition = "2021"
license = "MIT"

[lib]
name = "dsh_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync"] }
url = "2"
window-vibrancy = "0.6"

[dev-dependencies]
serde_json = "1"
